<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio Superadmin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans min-h-screen antialiased bg-slate-950 text-white">
  <div class="mesh-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="relative z-10 min-h-screen px-4 py-6 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-7xl">
      <header class="mb-8 flex flex-col gap-4 rounded-3xl border border-sky-400/10 bg-slate-950/70 p-4 shadow-2xl shadow-slate-950/20 sm:p-6">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-xs uppercase tracking-[0.3em] font-semibold text-sky-300/90">Acceso administrativo</p>
            <h1 id="welcome-superadmin" class="mt-2 text-2xl font-bold text-white sm:text-3xl">Bienvenido</h1>
          </div>
          <div class="flex items-center gap-3">
            <button id="btn-ir-dashboard" type="button" class="rounded-2xl border border-slate-700 bg-slate-900/70 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-sky-400/60 hover:text-sky-200">
              Dashboard
            </button>
            <button id="logout-btn" type="button" class="rounded-2xl bg-slate-900/70 border border-slate-700 px-4 py-2 text-sm text-sky-200 transition hover:bg-slate-800">
              Cerrar sesión
            </button>
          </div>
        </div>
      </header>

      <section class="grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
        <div class="rounded-3xl border border-slate-800 bg-slate-900/70 p-6 shadow-2xl shadow-slate-950/20">
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-sky-400">Panel principal</p>
              <h2 class="mt-2 text-2xl font-bold text-white">Gestión del proyecto</h2>
            </div>
            <button id="btn-superadmin-proyectos" type="button" class="rounded-2xl bg-sky-400 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-sky-300">
              Proyectos
            </button>
          </div>

          <div id="superadmin-search-panel" class="hidden rounded-2xl border border-slate-700 bg-slate-950/70 p-4">
            <label for="input-buscar-proyecto" class="block text-sm font-medium text-slate-300">Buscar proyecto por nombre o código</label>
            <input id="input-buscar-proyecto" type="text" placeholder="Ej: Plaza Las Delicias o PRJ-1234" class="mt-3 w-full rounded-2xl border border-slate-700 bg-slate-900/80 px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:border-sky-400 focus:outline-none" />
            <ul id="lista-proyectos-busqueda" class="mt-4 space-y-2"></ul>
          </div>

          <div class="mt-6 grid gap-4 sm:grid-cols-2">
            <button id="btn-agregar-proyecto-home" type="button" class="rounded-2xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-4 text-left transition hover:border-emerald-400/60 hover:bg-emerald-500/20">
              <p class="text-xs uppercase tracking-[0.25em] text-emerald-300">Administración</p>
              <h3 class="mt-2 text-lg font-semibold text-white">Agregar proyecto</h3>
              <p class="mt-2 text-sm text-slate-400">Crear un nuevo proyecto y registrarlo para seguimiento.</p>
            </button>

            <button id="btn-gestionar-usuarios-home" type="button" class="rounded-2xl border border-violet-500/30 bg-violet-500/10 px-4 py-4 text-left transition hover:border-violet-400/60 hover:bg-violet-500/20">
              <p class="text-xs uppercase tracking-[0.25em] text-violet-300">Seguridad</p>
              <h3 class="mt-2 text-lg font-semibold text-white">Gestionar usuarios</h3>
              <p class="mt-2 text-sm text-slate-400">Administrar permisos, roles y proyectos asociados.</p>
            </button>
          </div>
        </div>

        <aside class="rounded-3xl border border-slate-800 bg-slate-900/70 p-6 shadow-2xl shadow-slate-950/20">
          <p class="text-xs uppercase tracking-[0.25em] text-sky-400">Acceso rápido</p>
          <h2 class="mt-2 text-xl font-bold text-white">Superadmins activos</h2>
          <div class="mt-5 space-y-3">
            <div class="rounded-2xl border border-slate-700 bg-slate-950/60 px-4 py-3">
              <p class="text-sm font-semibold text-white">Gingerlin Molina</p>
              <p class="text-xs text-slate-400">Superadmin</p>
            </div>
            <div class="rounded-2xl border border-slate-700 bg-slate-950/60 px-4 py-3">
              <p class="text-sm font-semibold text-white">Kevinson Campos</p>
              <p class="text-xs text-slate-400">Superadmin</p>
            </div>
            <div class="rounded-2xl border border-slate-700 bg-slate-950/60 px-4 py-3">
              <p class="text-sm font-semibold text-white">Programador</p>
              <p class="text-xs text-slate-400">Programador / pruebas</p>
            </div>
          </div>
        </aside>
      </section>
    </div>
  </main>

  <script src="js/dashboard-data.js"></script>
  <script src="js/superadmin-home.js"></script>
</body>
</html>
